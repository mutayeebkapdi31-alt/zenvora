<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Zenvora</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #101827, #172554, #0f172a);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #172554;
            color: white;
            font-size: 30px;
        }

        h2 {
            font-weight: 700;
            text-align: center;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
        }

        .btn-login {
            height: 50px;
            border: none;
            border-radius: 12px;
            background: #172554;
            color: white;
            font-weight: 600;
            width: 100%;
        }

        .btn-login:hover {
            background: #1e3a8a;
            color: white;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #172554;
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2>Admin Login</h2>

    <p class="subtitle">
        Access the Zenvora administration panel
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_login') }}">

        <div class="mb-3">
            <label class="form-label fw-semibold">
                Admin Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter admin username"
                required
                autocomplete="username"
            >
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter admin password"
                required
                autocomplete="current-password"
            >
        </div>

        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Login to Admin Panel
        </button>

    </form>

    <a href="{{ url_for('index') }}" class="back-link">
        <i class="bi bi-arrow-left me-1"></i>
        Back to Website
    </a>

</div>

</body>
</html>
