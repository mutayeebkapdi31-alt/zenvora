{% extends "base.html" %}

{% block title %}Create Account | Zenvora{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            Z
        </div>

        <span class="eyebrow">
            JOIN ZENVORA
        </span>

        <h1>
            Create your
            <span>account.</span>
        </h1>

        <p>
            Start discovering properties made for you.
        </p>


        <form method="POST">

            <label>Full Name</label>

            <input type="text"
                   name="name"
                   placeholder="Your name"
                   required>


            <label>Email Address</label>

            <input type="email"
                   name="email"
                   placeholder="you@example.com"
                   required>


            <label>Phone Number</label>

            <input type="text"
                   name="phone"
                   placeholder="+91 XXXXX XXXXX">


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>


            <button class="auth-btn">
                Create Account →
            </button>

        </form>


        <div class="auth-divider">
            Already registered?
        </div>

        <a href="{{ url_for('login') }}"
           class="auth-secondary">
            Sign in instead
        </a>

    </div>

</div>

{% endblock %}
