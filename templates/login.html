{% extends "base.html" %}

{% block title %}User Login | Zenvora{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            Z
        </div>

        <span class="eyebrow">
            WELCOME BACK
        </span>

        <h1>
            Sign in to
            <span>Zenvora.</span>
        </h1>

        <p>
            Access your shortlisted properties,
            inquiries and profile.
        </p>

        <form method="POST">

            <label>Email Address</label>

            <input type="email"
                   name="email"
                   placeholder="you@example.com"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="••••••••"
                   required>


            <button class="auth-btn">
                Sign In →
            </button>

        </form>


        <div class="auth-divider">
            New to Zenvora?
        </div>

        <a href="{{ url_for('register') }}"
           class="auth-secondary">
            Create an account
        </a>


        <a href="{{ url_for('admin_login') }}"
           class="admin-link">
            Admin Portal →
        </a>

    </div>

</div>

{% endblock %}
